<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3eee4" id="themeColor">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>
  (function () {
    var mode = 'auto';
    try {
      var saved = localStorage.getItem('desk-theme');
      if (saved === 'dark' || saved === 'light' || saved === 'auto') mode = saved;
    } catch (e) {}
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var resolved = mode === 'auto' ? (dark ? 'dark' : 'light') : mode;
    document.documentElement.setAttribute('data-theme-mode', mode);
    document.documentElement.setAttribute('data-theme', resolved);
    var scheme = document.querySelector('meta[name="color-scheme"]');
    if (scheme) scheme.setAttribute('content', mode === 'auto' ? 'light dark' : resolved);
    var meta = document.getElementById('themeColor');
    if (meta) meta.setAttribute('content', resolved === 'light' ? '#f3eee4' : '#12110f');
  })();
</script>
