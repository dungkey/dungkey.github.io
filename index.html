<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e4d7c5" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232a241d'/%3E%3Cpath d='M8 21h16M11 21v-7M16 21V10M21 21v-5' stroke='%23f4ecdf' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>书架 · 3D 藏书阁</title>
    <link rel="stylesheet" href="./assets/fonts/kinghwa/result.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/reader.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <main class="scene">
      <div class="stage" id="stage"></div>
      <div class="vignette" aria-hidden="true"></div>

      <div class="shelf-empty-hint" id="shelf-empty-hint" aria-live="polite">
        <p>书架空空如也 · 点击右下角「+」或拖入 EPUB 书籍</p>
      </div>

      <div class="shelf-toast" id="shelf-toast" role="status" aria-live="polite"></div>

      <div class="add-dock" id="add-dock">
        <input
          id="epub-input"
          type="file"
          accept=".epub,application/epub+zip"
          multiple
          hidden
        />

        <button
          class="add-book"
          id="add-book"
          type="button"
          aria-label="导入 EPUB 书籍"
          title="导入 EPUB 书籍（支持多选或直接拖入）"
        >
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 4v12M4 10h12" />
          </svg>
        </button>
      </div>
    </main>

    <div class="curtain" id="curtain" aria-hidden="true"></div>

    <script type="module" src="./src/scene.js"></script>
  </body>
</html>
