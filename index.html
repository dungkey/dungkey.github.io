<script>
  (function () {
    var mode = 'auto';
    try {
      var saved = localStorage.getItem('desk-theme');
      if (saved === 'dark' || saved === 'light' || saved === 'auto') mode = saved;
    } catch (e) {}
    var light = !window.matchMedia || !window.matchMedia('(prefers-color-scheme: dark)').matches;
    var resolved = mode === 'auto' ? (light ? 'light' : 'dark') : mode;
    document.documentElement.setAttribute('data-theme-mode', mode);
    document.documentElement.setAttribute('data-theme', resolved);
    var meta = document.getElementById('themeColor');
    if (meta) meta.setAttribute('content', resolved === 'light' ? '#f3eee4' : '#12110f');
  })();
</script>

<div class="page">

    <div class="spine-title">
      <h1>工作台</h1>
      <span class="seal" id="seal" aria-hidden="true">丙午</span>
    </div>

    <div class="theme-switch" role="group" aria-label="界面配色">
      <button type="button" data-set-theme="light" aria-pressed="false" title="浅色">明</button>
      <button type="button" data-set-theme="dark" aria-pressed="false" title="深色">暗</button>

  <main class="leaf" id="main" tabindex="-1">
    <header class="masthead">
      <p class="date" id="date">&nbsp;</p>
      <div class="now-row">
        <p class="clock"><time id="clock">00:00</time><span class="clock-sec" id="clockSec" aria-hidden="true">00</span></p>

        <!-- 随身听：伴随当下的背景音乐，不是目录里的去处 -->
        <section class="deck" id="track" aria-label="音乐播放器">
          <audio id="audio" preload="metadata"></audio>
          <div class="deck-head">
            <span class="deck-state" aria-hidden="true"><span class="state-on">正在听</span><span class="state-off">待播</span></span>
            <button class="btn-list" id="trackListBtn" type="button" aria-label="曲目列表 – / –" aria-expanded="false" aria-controls="deckPlaylist" title="查看曲目列表" disabled>
              曲目 <span id="trackCount">– / –</span>
            </button>
          </div>
          <p class="now" aria-live="polite" aria-atomic="true">
            <span class="now-title" id="trackTitle">正在载入曲目…</span>
            <span class="now-artist" id="trackArtist"></span>
          </p>
          <div class="seek-row">
            <span class="time" id="cur">0:00</span>
            <input class="seek" id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度" disabled>
            <span class="time" id="dur">--:--</span>
          </div>
          <div class="deck-controls">
            <button class="btn-icon" id="modeBtn" type="button" aria-label="播放模式：列表循环" title="切换播放模式 (当前：列表循环)" disabled>
              <svg class="icon-mode-loop" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
              <svg class="icon-mode-single" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></svg>
              <svg class="icon-mode-shuffle" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M16 3h5v5M4 20l17-17M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
            </button>
            <button class="btn-icon" id="prev" type="button" aria-label="上一首" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 9 12l10 7z"/></svg>
            </button>
            <button class="btn-play" id="play" type="button" aria-label="播放" disabled>
              <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
            </button>
            <button class="btn-icon" id="next" type="button" aria-label="下一首" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l10 7-10 7z"/></svg>
            </button>
            <span class="deck-vol-wrap">
              <button class="btn-icon" id="volBtn" type="button" aria-label="音量控制" aria-controls="volPopover" aria-expanded="false" title="音量控制" disabled>
                <svg class="icon-vol-high" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                <svg class="icon-vol-low" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                <svg class="icon-vol-mute" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6M17 9l6 6"/></svg>
              </button>
            </span>
          </div>

          <div class="vol-popover" id="volPopover" role="group" aria-label="音量控制">
            <input class="vol-range" id="volRange" type="range" min="0" max="100" step="1" value="80" aria-label="音量大小" disabled>
            <button class="btn-text" id="volMuteBtn" type="button" aria-label="静音" disabled>静音</button>
          </div>

          <div class="deck-playlist" id="deckPlaylist" hidden>
            <div class="deck-playlist-header">
              <span>曲目</span>
              <button class="btn-text" id="deckPlaylistClose" type="button" aria-label="关闭列表">收起</button>
            </div>
            <ul class="deck-playlist-items" id="deckPlaylistItems" aria-label="曲目列表"></ul>
          </div>
        </section>

      <p class="motto"><span class="nowrap">读书，下棋，听一点音乐。</span><span class="nowrap">一个安静的个人工作台。</span></p>

    <script>
      (function () {
        var CN = '〇一二三四五六七八九';
        var STEM = '甲乙丙丁戊己庚辛壬癸';
        var BRANCH = '子丑寅卯辰巳午未申酉戌亥';
        var WEEK = '日一二三四五六';
        function cnNum(n) {
          if (n <= 10) return n === 10 ? '十' : CN[n];
          if (n < 20) return '十' + CN[n - 10];
          return CN[Math.floor(n / 10)] + '十' + (n % 10 ? CN[n % 10] : '');
        }
        function cnYear(y) {
          return String(y).split('').map(function (d) { return CN[+d]; }).join('');
        }
        var clock = document.getElementById('clock');
        var sec = document.getElementById('clockSec');
        var date = document.getElementById('date');
        var seal = document.getElementById('seal');
        var lastDay = -1;
        function pad(n) { return (n < 10 ? '0' : '') + n; }
        function tick() {
          var d = new Date();
          clock.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
          clock.setAttribute('datetime', d.toISOString());
          sec.textContent = pad(d.getSeconds());
          if (d.getDate() !== lastDay) {
            lastDay = d.getDate();
            var y = d.getFullYear();
            date.textContent = cnYear(y) + '年' + cnNum(d.getMonth() + 1) + '月' + cnNum(d.getDate()) + '日　星期' + WEEK[d.getDay()];
            seal.textContent = STEM[((y - 4) % 10 + 10) % 10] + BRANCH[((y - 4) % 12 + 12) % 12];
          }
          var yearEl = document.getElementById('year');
          if (yearEl) yearEl.textContent = String(d.getFullYear());
        }
        tick();
        setTimeout(function () { tick(); setInterval(tick, 1000); }, 1000 - (Date.now() % 1000));
      })();
    </script>
